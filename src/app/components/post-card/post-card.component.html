<div class="card border-0 col-4" class={{backgroundColor}}>
    <div class="card-header border-0 d-flex justify-content-between">
      <p class="text-muted">{{topTitle}}</p>
      <i class={{icon}} class="text-primary display-5"></i>
    </div>
    <div class="card-body border-0">
      <h5 class="card-title">{{title}}</h5>
      <p class="card-text text-muted">{{desc}}</p>
      <p class="text-muted">{{postLength}}</p>
    </div>
  </div>
