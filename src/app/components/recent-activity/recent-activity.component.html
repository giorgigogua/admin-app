<ul class="list-group card-body">
    <li class="list-group-item d-flex border-0">
        <div class="d-flex gap-2">
            <div class="d-flex flex-column">
                <span class="p-2 rounded-circle" style="background-color: #E3F2FD">
                    <i class={{icon}} class="text-primary"></i>
                </span>
            </div>
            <div>
                <div class="d-flex gap-2">
                    <span class="small fw-bold">{{name}}</span>
                    <span class="text-muted small">{{time}}</span>
                </div>
                <p class="small">{{activity}}</p>
            </div>
        </div>
    </li>
</ul>
