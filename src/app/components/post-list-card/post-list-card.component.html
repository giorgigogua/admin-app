<div>
    <div class="d-flex justify-content-between">
        <div>
            <h6>{{title}}</h6>
            <p class="text-muted">{{content}}</p>
        </div>
        <div *ngIf="image">
            <div style="width: 70px; height: 70px;">
                <img class="w-100 h-100 rounded-4" src={{img}} alt="">
            </div>
        </div>
    </div>
    <div class="card-body p-0 d-flex gap-3">
        <p class="text-muted">{{date}}</p>
        <li class="nav-item dropdown">
            <a class="nav-link" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                ...
            </a>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item text-muted">{{listDropDownItemOne}}</a></li>
                <li><a class="dropdown-item text-muted">{{listDropDownItemTwo}}</a></li>
                <li><a class="dropdown-item text-muted">{{listDropDownItemThree}}</a></li>
            </ul>
    </div>
</div>
