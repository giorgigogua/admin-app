<div class="w-100 row align-items-center justify-content-between">
    <div class="d-flex gap-4 align-items-center col col-lg-8 col-md-7 col-sm-12 col-12">
        <div>
            <i class={{icon}} class="display-5 text-primary bg-light rounded-4 p-2"></i>
        </div>
        <div>
            <div class="d-flex gap-2">
                <div>
                    <span>{{titleOne}}</span>
                </div>
                <div>
                    <span>{{titleTwo}}</span>
                </div>
            </div>
            <div>
                <h4>{{titleThree}}</h4>
            </div>
        </div>
    </div>

    <div *ngIf="editButton" class="col col-lg-2 col-md-3 col-12">
        <button class="btn btn-light col col-sm-12 col-12">{{editButton}}</button>
    </div>
    <div *ngIf="buttonText" class="col col-lg-2 col-md-auto col-12">
        <button class="btn btn-warning col col-sm-12 col-12" [disabled]="Disabled" (click)="buttonClick">{{buttonText}}</button>
    </div>
    <div *ngIf="deleteButton" class="col col-lg-2 col-md-auto col-12">
        <button class="btn btn-danger col col-sm-12 col-12">{{deleteButton}}</button>
    </div>

</div>
