<div class="d-flex justify-content-between mt-5">
    <div *ngIf="filterBoxSpan">
        <span>{{filterBoxSpan}}</span>
    </div>
    <div class="d-flex gap-2" *ngIf="publDrafts">
        <div *ngIf="published">
            <button class="border-0 bg-light p-2 rounded-3">Published</button>
        </div>
        <div *ngIf="drafts">
            <button class="border-0 bg-light p-2 rounded-3">Drafts</button>
        </div>
    </div>
    <div class="d-flex align-items-center gap-2">
        <div *ngIf="isInput">
            <div class="input-group w-100">
                <input class="form-control" id="topnavSearchInput" type="search" placeholder="Search"
                    aria-label="Search" aria-describedby="navbarSearch">
                <span class="input-group-text" id="navbarSearch">
                    <i class="bi bi-search"></i>
                </span>
            </div>
        </div>
        <div class="d-flex gap-2">
            <div>
                <div class="dropdown">
                    <button class="bi bi-filter bg-light p-2 border-0 " type="button" id="dropdownMenuButton"
                        data-toggle="dropdown"  aria-expanded="false"></button>
                    <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                        <a class="dropdown-item" href="#">Action</a>
                        <a class="dropdown-item" href="#">Another action</a>
                        <a class="dropdown-item" href="#">Something else here</a>
                    </div>
                </div>
            </div>
            <div>
                <div class="dropdown">
                    <button class="bi bi-sort-alpha-down bg-light p-2 border-0 " type="button" id="dropdownMenuButton"
                        data-toggle="dropdown"  aria-expanded="false"></button>
                    <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                        <a class="dropdown-item" href="#">Action</a>
                        <a class="dropdown-item" href="#">Another action</a>
                        <a class="dropdown-item" href="#">Something else here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
