<div class="d-flex align-items-center gap-3 card-body" *ngFor="let item of goals">
    <div class="bg-light p-2 rounded-circle">
        <app-progress-circle width="20px" height="20px" [progress]="item.percent"
            [color]="item.color"></app-progress-circle>
    </div>
    <div class="w-100 d-flex justify-content-between">
        <div>
            <span class="small">{{item.name}}</span>
            <p class="small text-muted">{{item.desc}}</p>
        </div>
        <div>
            <span class="text-muted">{{item.date}}</span>
        </div>
    </div>
</div>
