<div class="container">
    <div class="row gap-5">
        <div class="col-xl-8 col-lg-8 col-md-12 border border-1 border-secondary p-4 rounded-5">
            <div class="d-flex justify-content-between py-3">
                <div>
                    <h6>Performance</h6>
                </div>
                <div class="d-flex gap-3">
                    <div class="d-flex gap-2">
                        <i class="bi bi-circle-fill text-primary"></i>
                        <span>Total</span>
                    </div>
                    <span>Tracked</span>
                </div>
            </div>
            <hr>
            <app-bar-chart></app-bar-chart>
        </div>
        <div class="col-xl-3 col-md-8 border border-1 border-secondary p-4 rounded-5">
            <div class="d-flex flex-column gap-4">
                <div>
                    <h6>Goals</h6>
                </div>
                <hr>
                <div>
                    <div class="d-flex align-items-center gap-4" *ngFor="let item of goals">
                        <div>
                            <i class="bi bi-circle-fill text-primary"></i>
                        </div>
                        <div>
                            <span>{{item.name}}</span>
                            <p class="text-muted">{{item.price}}</p>
                        </div>
                        <div>
                            <p class="text-muted">{{item.date}}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
