<div class="container">
    <div class="row gap-1 align-items-center">
        <div class="col-xl-8 col-lg-8 col-md-12 border border-1 border-card p-4 rounded-3">
            <div class="d-flex justify-content-between py-3">
                <div>
                    <h6>Performance</h6>
                </div>
                <div class="d-flex gap-3">
                    <div class="d-flex gap-2">
                        <i class="bi bi-circle-fill text-primary"></i>
                        <span>Total</span>
                    </div>
                    <span>Tracked</span>
                </div>
            </div>
            <hr>
            <app-bar-chart></app-bar-chart>
        </div>
        <div class="col rounded-5">
            <div class="card border-card">
                <div class="card-header py-2 p-3 bg-white border-light">
                    <h5>Goals</h5>
                </div>
                <div class="d-flex align-items-center gap-2 card-body" *ngFor="let item of goals">
                    <div>
                        <i class="bg-light p-2 rounded-circle" class={{item.icon}}></i>
                    </div>
                    <div class="w-100 d-flex align-items-center justify-content-between">
                        <div>
                            <span>{{item.name}}</span>
                            <p>{{item.price}}</p>
                        </div>
                        <div>
                            <span>{{item.date}}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
