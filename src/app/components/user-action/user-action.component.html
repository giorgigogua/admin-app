<div class="d-flex flex-column py-2" *ngFor="let item of users">
    <div class="d-flex gap-2">
        <div class="py-2">
            <img width="40px" height="40px" src={{item.img}} class="rounded-circle" alt="">
        </div>
        <div class="d-flex flex-column">
            <div>
                <span class="fw-semibold">{{item.name}} . <span class="fw-normal small">{{item.action}}</span></span>
            </div>
            <div class="py-1">
                <small class="text-muted">{{item.time}}</small>
            </div>
            <div class="border p-2 rounded-3 d-flex flex-column gap-2">
                <span>{{item.comment}}</span>
                <div>
                    <span>
                        <button class="border-0 btn btn-light rounded-3 btn-sm p-2">Update now</button>
                        <button class="border-0 btn btn-white btn-sm rounded-3 p-2">Dismiss</button>
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>
