<div class="container">
    <div class="py-4">
        <app-page-title titleOne="Posts" titleTwo="Categories" titleThree="Categories" buttonText="+ New category" icon="bi bi-person"></app-page-title>
    </div>

    <div class="row" *ngFor="let item of categories">
        <app-post-card title={{item.title}} postLength={{item.postLength}} topTitle={{item.topTitle}}  icon={{item.img}} backgroundColor={{item.backgroundColor}}></app-post-card>
    </div>
</div>
