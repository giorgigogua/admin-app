<div class="container">
    <div class="row d-flex justify-content-center py-5">
        <div class="col-lg" *ngFor="let item of gridListItem">
            <app-grid-list title={{item.name}} content={{item.price}} icon={{item.icon}}></app-grid-list>
        </div>
    </div>

    <div class="row">
        <div class="col col-lg-10 col-xl-4 col-md-12">
            <app-user-card></app-user-card>
        </div>
        <div class="col col-md-12 col-sm-12 col-lg-12 col-xl-8">
            <div>
                <app-customers-table theadTwo="true" tbodyTwo="true"></app-customers-table>
            </div>
            <div>
                <div class="d-flex justify-content-between">
                    <h5>Files</h5>
                    <p>Upload</p>
                </div>
                <hr>
                <div>
                    <app-upload-table></app-upload-table>
                </div>
            </div>
        </div>

    </div>

</div>
