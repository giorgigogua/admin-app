<div class="container" style="height: 700px;">
    <app-go-back></app-go-back>
    <div class="w-100 h-100 d-flex flex-column justify-content-center align-items-center">
        <div>
            <div class="text-center">
                <h1>Password reset</h1>
                <p>Regain access to your account and stay on top of your tasks.</p>
            </div>
            <form class="d-flex flex-column gap-3">
                <div class="form-group">
                    <input name="name" type="text" class="form-control form-control-lg bg-light border-0 w-100"
                        placeholder="Enter your email adress." id="name" aria-describedby="name">
                </div>
                <button class="border-0 bg-warning p-2 rounded-3">Reset password</button>
            </form>
            <div class="py-3 text-center">
                <span class="text-muted">Dont have any account yet? <span class="text-primary"
                        (click)="navigateToSignIn()">Sign
                        up.</span></span>
            </div>
        </div>
    </div>
</div>
