<div class="container">
    <div class="row">
        <div class="py-4 col-lg">
            <h1 class="text-black">{{"Hello"|translate}}, John</h1>
            <p class="text-secondary">{{"WelcomeText"|translate}}</p>
        </div>
        <div class="col-auto d-flex align-items-center">
            <div class="avatar text-primary me-2 d-flex align-items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24"
                    class="fs-4 duo-icon duo-icon-world bg-light p-2 rounded-circle" data-duoicon="world">
                    <path fill="currentColor"
                        d="M12 2c5.523 0 10 4.477 10 10s-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2Z"
                        class="duoicon-secondary-layer" opacity=".3"></path>
                    <path fill="currentColor"
                        d="M12 4a7.988 7.988 0 0 0-6.335 3.114l-.165.221V9.02c0 1.25.775 2.369 1.945 2.809l.178.06 1.29.395c1.373.42 2.71-.697 2.577-2.096l-.019-.145-.175-1.049a1 1 0 0 1 .656-1.108l.108-.03.612-.14a2.667 2.667 0 0 0 1.989-3.263A7.987 7.987 0 0 0 12 4Zm2 9.4-1.564 1.251a.5.5 0 0 0-.041.744l1.239 1.239c.24.24.415.538.508.864l.175.613c.147.521.52.948 1.017 1.163a8.026 8.026 0 0 0 2.533-1.835l-.234-1.877a2 2 0 0 0-1.09-1.54l-1.47-.736A1 1 0 0 0 14 13.4Z"
                        class="duoicon-primary-layer"></path>
                </svg>
                <span class="text-dark">San Francisco, CA - 8:00 PM</span>
            </div>
        </div>
    </div>
    <hr>
    <div class="row py-5">
        <div class="col-lg" *ngFor="let item of gridListItem">
            <app-grid-list title={{item.name}} content={{item.price}} icon={{item.icon}}></app-grid-list>
        </div>

    </div>
    <div class="row gap-2">

        <div
            class="col-xl-8 col-lg-8 col-md-12 border border-1 border-card rounded-3 d-flex flex-column justify-content-center h-100">
            <div class="d-flex justify-content-between align-items-center mt-2">
                <div>
                    <h5>Performance</h5>
                </div>
                <div class="d-flex gap-2">
                    <div class="d-flex gap-2">
                        <i class="bi bi-circle-fill text-primary small"></i>
                        <small>Tracked</small>
                    </div>
                    <div class="d-flex gap-2">
                        <i class="bi bi-circle-fill text-light small"></i>
                        <small>Total</small>
                    </div>
                </div>
            </div>
            <hr>
            <div class="">
                <canvas id="defaultChart"></canvas>
            </div>
        </div>

        <div class="card col">
            <div class="card-header py-2 p-3 bg-white border-card">
                <h5>Goals</h5>
            </div>
            <div>
                <app-goals></app-goals>
            </div>
        </div>

    </div>


    <div class="row py-3 gap-2">
        <div class="col-xl-8 col-lg-8 col-md-12 border border-1 border-card rounded-3 h-100">
            <div class="mt-2">
                <app-browse-all title="Table list"></app-browse-all>
            </div>
            <hr>
            <app-table></app-table>
        </div>
        <div class="card col h-100">
            <div class="card-header bg-body">
                <h5>Recent activity</h5>
            </div>
            <div *ngFor="let item of cryptoListItem">
                <app-recent-activity name={{item.name}} time={{item.date}} activity={{item.activity}}
                    icon={{item.icon}}></app-recent-activity>
            </div>
        </div>
    </div>


</div>
