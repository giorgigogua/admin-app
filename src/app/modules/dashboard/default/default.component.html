<div class="container">
    <div class="d-flex align-items-center justify-content-between">
        <div class="py-4">
            <h1 class="text-black">Hello, John</h1>
            <p class="text-secondary">Here's a summary of your account activity for thiw week</p>
        </div>
        <div class="d-flex gap-3">
            <div class="avatar text-info me-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    class="fs-4 duo-icon duo-icon-world" data-duoicon="world">
                    <path fill="currentColor"
                        d="M12 2c5.523 0 10 4.477 10 10s-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2Z"
                        class="duoicon-secondary-layer" opacity=".3"></path>
                    <path fill="currentColor"
                        d="M12 4a7.988 7.988 0 0 0-6.335 3.114l-.165.221V9.02c0 1.25.775 2.369 1.945 2.809l.178.06 1.29.395c1.373.42 2.71-.697 2.577-2.096l-.019-.145-.175-1.049a1 1 0 0 1 .656-1.108l.108-.03.612-.14a2.667 2.667 0 0 0 1.989-3.263A7.987 7.987 0 0 0 12 4Zm2 9.4-1.564 1.251a.5.5 0 0 0-.041.744l1.239 1.239c.24.24.415.538.508.864l.175.613c.147.521.52.948 1.017 1.163a8.026 8.026 0 0 0 2.533-1.835l-.234-1.877a2 2 0 0 0-1.09-1.54l-1.47-.736A1 1 0 0 0 14 13.4Z"
                        class="duoicon-primary-layer"></path>
                </svg>
            </div>
            <p>San Francisco, CA - 8:00 PM</p>
        </div>
    </div>
    <hr>
    <div class="row d-flex align-items-center justify-content-center py-5 container">
        <div class="col-lg" *ngFor="let item of gridList">
            <app-grid-list title="hours logged" content="34hrs"></app-grid-list>
        </div>

    </div>
    <div>
        <app-goals></app-goals>
    </div>
    <div>
        <div class="container">
            <div class="row gap-3 py-4">
                <div class="col-xl-8 col-lg-8 col-md-12 border border-1 border-light rounded-5 p-4">
                    <app-browse-all title="Active Projects"></app-browse-all>
                    <hr>
                    <app-table></app-table>
                </div>
                <div class="col-xl-3 col-md-8 p-4 rounded-5" style="height: max-content;">
                    <app-recent-activity name="You" title="Recent Activity" time="1hr ago"
                        activity="Liked by john doe"></app-recent-activity>
                </div>
            </div>
        </div>
    </div>
</div>
