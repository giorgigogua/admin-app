<div class="container">
  <div class="d-flex justify-content-between align-items-center">
    <div class="d-flex flex-column">
      <p>Performance</p>
      <h1>$20.000</h1>
    </div>
    <div>
      <li class="nav-item dropdown">
        <a class="nav-link dropdown-toggle bg-light p-3 rounded-3" role="button" data-bs-toggle="dropdown"
          aria-expanded="false">
          Trading Profits
        </a>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="#">Trading Profits</a></li>
          <li><a class="dropdown-item" href="#">Staking Rewards</a></li>
          <li><a class="dropdown-item" href="#">Mining Income</a></li>
        </ul>
      </li>
    </div>
  </div>
  <div>
    <app-line-chart></app-line-chart>
  </div>
  <div>
    <div class="row mt-5 gap-2 justify-content-center">
      <div class="col-xl-8 col-lg-8 col-md-12 border border-1 border-card p-3 rounded-3 card h-100">
        <div class="d-flex justify-content-between card-header bg-white border-light">
          <p>Watchlist</p>
          <button type="button" class="btn btn-white" (click)="openModel()">Add +</button>
        </div>

        <div>
          <app-crypto-table></app-crypto-table>
        </div>

      </div>
      <div class="card col rounded-3">
        <div class="card-header border-card bg-white">
          <p>Portfolio</p>
        </div>
        <div class="card-body">
          <app-pie-chart></app-pie-chart>
        </div>
      </div>
    </div>
  </div>
  <div class="row mt-3 gap-2 justify-content-center">
    <div class="col-xl-8 col-lg-8 col-md-12 border border-1 border-card p-3 rounded-3 card">
      <div>
        <app-browse-all title="Industry news"></app-browse-all>
      </div>
      <div class="py-3">
        <app-post-list-card title="Bitcoin Hits New All-Time High"
          content="Bitcoin's value surges past $70,000 amid global economic uncertainty." date="Published on September 10, 2024
        "></app-post-list-card>
        <hr>
        <app-post-list-card title="Bitcoin Hits New All-Time High"
          content="Bitcoin's value surges past $70,000 amid global economic uncertainty." date="Published on September 10, 2024
      "></app-post-list-card>
        <hr>
        <app-post-list-card title="Bitcoin Hits New All-Time High"
          content="Bitcoin's value surges past $70,000 amid global economic uncertainty." date="Published on September 10, 2024
    "></app-post-list-card>
      </div>
    </div>
    <div class="card col">
      <div class="card-header border-card bg-white py-2 px-3">
        <app-browse-all title="Crypto"></app-browse-all>
      </div>
      <div *ngFor="let item of cryptoListItem">
        <app-recent-activity name={{item.name}} time={{item.date}} activity={{item.activity}} icon={{item.icon}}></app-recent-activity>
      </div>
    </div>
  </div>


  <!--MODAL-->

  <div id="myModal" class="modal" style="z-index: 10000;">
    <div class="modal-dialog">

      <div class="modal-content">
        <div class="modal-header">
          <button type="button" class="close border-0 bg-body" data-dismiss="modal"
            (click)="closeModel()">&times;</button>
          <h4 class="modal-title">Add crypto list</h4>
        </div>
        <div class="modal-body">
          <div class="d-flex flex-column gap-2">
            <form>
              <input type="text" name="name" [(ngModel)]="cryptoTableFormData.name">

              <input type="text" name="lastPrice" [(ngModel)]="cryptoTableFormData.lastPrice">
              <input type="text" name="change" [(ngModel)]="cryptoTableFormData.change">
              <input type="text" name="lastHour" [(ngModel)]="cryptoTableFormData.lastHour">
              <input type="text" name="icon" [(ngModel)]="cryptoTableFormData.icon">
            </form>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-default" data-dismiss="modal" (click)="closeModel()">Close</button>
          <button type="button" class="btn btn-primary" (click)="createList()">Create</button>
        </div>
      </div>

    </div>
  </div>

  <!--MODAL END-->
</div>
