<div class="container">
  <div class="d-flex justify-content-between align-items-center">
    <div class="d-flex flex-column">
      <p>Performance</p>
      <h1>$20.000</h1>
    </div>
    <div>
      <li class="nav-item dropdown">
        <a class="nav-link dropdown-toggle bg-light p-3 rounded-3" role="button" data-bs-toggle="dropdown"
          aria-expanded="false">
          Trading Profits
        </a>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="#">Trading Profits</a></li>
          <li><a class="dropdown-item" href="#">Staking Rewards</a></li>
          <li><a class="dropdown-item" href="#">Mining Income</a></li>
        </ul>
      </li>
    </div>
  </div>
  <div>
    <app-line-chart></app-line-chart>
  </div>
  <div>
    <div class="row mt-5 gap-5 justify-content-center">
      <div class="col-xl-8 col-lg-8 col-md-12 border border-1 border-card p-3 rounded-4 card">
        <div class="d-flex justify-content-between card-header bg-white border-light">
          <p>Watchlist</p>
          <p>+ Add</p>
        </div>
        <table class="table">
          <thead>
            <tr>
              <th scope="col"><small class="text-muted">Name</small></th>
              <th scope="col"><small class="text-muted">Last price (USD)</small></th>
              <th scope="col"><small class="text-muted">Change</small></th>
              <th scope="col"><small class="text-muted">Last 24hr</small></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>
                <div class="d-flex gap-2">
                  <div>
                    <img width="30" height="30"
                      src="https://yevgenysim-turkey.github.io/dashbrd/assets/img/crypto/btc.svg" alt="">
                  </div>
                  <div>
                    <strong class="fw-semibold">Bitcoin</strong>
                  </div>
                </div>
              </td>
              <td>621,879.81</td>
              <td>+0.53%</td>
              <td>Line</td>
              <td><span class="bg-light p-2" role="button">Trade</span></td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="card col-xl-3 col-md-8 rounded-4">
        <div class="card-header border-card bg-white">
          <p>Portfolio</p>
        </div>
        <div class="card-body">
          <app-pie-chart></app-pie-chart>
        </div>
      </div>
    </div>
  </div>
  <div class="row mt-5 gap-5 justify-content-center">
    <div class="col-xl-8 col-lg-8 col-md-12 border border-1 border-card p-4 rounded-4 card">
      <div>
        <app-browse-all title="Industry news"></app-browse-all>
      </div>
      <div class="py-3">
        <app-post-list-card title="Bitcoin Hits New All-Time High"
          content="Bitcoin's value surges past $70,000 amid global economic uncertainty." date="Published on September 10, 2024
        "></app-post-list-card>
        <hr>
        <app-post-list-card title="Bitcoin Hits New All-Time High"
          content="Bitcoin's value surges past $70,000 amid global economic uncertainty." date="Published on September 10, 2024
      "></app-post-list-card>
        <hr>
        <app-post-list-card title="Bitcoin Hits New All-Time High"
          content="Bitcoin's value surges past $70,000 amid global economic uncertainty." date="Published on September 10, 2024
    "></app-post-list-card>
      </div>
    </div>
    <div class="card col-xl-3 col-md-8 p-3">
      <div class="card-header border-card bg-white py-3 px-3">
        <app-browse-all title="Crypto"></app-browse-all>
      </div>
      <div *ngFor="let item of cryptoList">
        <app-recent-activity name={{item.name}} time={{item.date}} activity={{item.activity}}></app-recent-activity>
      </div>
    </div>
  </div>
</div>
